<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 飞檐翚影</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:       #444C5E;
            --primary-light: #5A6180;
            --primary-dark:  #2A2F40;
            --secondary:     #A29192;
            --accent:        #8A9BC5;
            --accent-light:  #B8C4D9;
            --bg:            #F0F2F5;
            --bg-card:       #FFFFFF;
            --bg-muted:      #E8EBF0;
            --text-main:     #2a3246;
            --text-sub:      #4b5d88;
            --text-muted:    #9E9E9E;
            --text-light:    rgba(245,245,220,0.85);
            --border:        rgba(68,76,94,0.15);
            --shadow-sm:     0 2px 8px rgba(68,76,94,0.08);
            --shadow-md:     0 6px 20px rgba(68,76,94,0.12);
            --shadow-lg:     0 16px 48px rgba(68,76,94,0.18);
            --radius-sm:     6px;
            --radius-md:     12px;
            --radius-lg:     20px;
            --transition:    0.32s cubic-bezier(0.4,0,0.2,1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #4b5d88 0%, #2a3246 25%, #8A9BC5 55%, #5A6180 80%, #444C5E 100%);
            font-family: 'Noto Serif SC', 'SimSun', serif;
            color: var(--text-main);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(196,30,58,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(201,168,76,0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            width: 420px;
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #F7F3ED;
        }

        .login-logo h1 {
            font-size: 1.6em;
            color: var(--primary-dark);
            letter-spacing: 0.08em;
        }

        .login-logo p {
            font-size: 0.85em;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .tab-switch {
            display: flex;
            margin-bottom: 28px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid rgba(139,69,19,0.15);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95em;
            color: var(--text-sub);
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.05em;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #F7F3ED;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88em;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(139,69,19,0.2);
            border-radius: 8px;
            font-size: 0.95em;
            font-family: 'Noto Serif SC', serif;
            background: #fff;
            transition: all var(--transition);
            color: var(--text-main);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139,69,19,0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #F7F3ED;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.05em;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 16px rgba(93,43,10,0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(93,43,10,0.45);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9em;
            transition: color var(--transition);
        }

        .back-link a:hover { color: var(--accent); }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88em;
            margin-bottom: 16px;
            display: none;
        }

        .message.error {
            background: rgba(196,30,58,0.1);
            color: var(--accent);
            border: 1px solid rgba(196,30,58,0.2);
            display: block;
        }

        .message.success {
            background: rgba(46,139,87,0.1);
            color: #2E8B57;
            border: 1px solid rgba(46,139,87,0.2);
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <h1>飞檐翚影</h1>
            <p>中国古建筑文化展示平台</p>
        </div>

        <div class="tab-switch">
            <button class="tab-btn active" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" onclick="switchTab('register')">注册</button>
        </div>

        <div id="message" class="message"></div>

        <!-- 登录表单 -->
        <div id="loginPanel" class="form-panel active">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="submit-btn" onclick="handleLogin()">登录</button>
        </div>

        <!-- 注册表单 -->
        <div id="registerPanel" class="form-panel">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="regEmail" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码">
            </div>
            <button class="submit-btn" onclick="handleRegister()">注册</button>
        </div>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerPanel').classList.add('active');
            }
            document.getElementById('message').className = 'message';
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) {
                showMessage('请填写所有字段', 'error');
                return;
            }
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                const response = await fetch('/architecture/login/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showMessage('登录成功！正在跳转...', 'success');
                    setTimeout(() => location.href = 'index.html', 1000);
                } else {
                    showMessage(data.message || '登录失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            if (!username || !email || !password) {
                showMessage('请填写所有字段', 'error');
                return;
            }
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('email', email);
                const response = await fetch('/architecture/register/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.status === 'success') {
                    showMessage('注册成功！请登录', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showMessage(data.message || '注册失败', 'error');
                }
            } catch (e) {
                showMessage('网络错误，请重试', 'error');
            }
        }
    </script>
</body>
</html>
