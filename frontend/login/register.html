<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>登录页面</title>
    <link rel="stylesheet" type="text/css" href="../css/login.css" />
</head>

<body>
    <div id="back">

        <div class="backRight">
        </div>
        <div class="backLeft">
        </div>
    </div>

    <div id="slideBox">
        <div class="topLayer">
            <div class="left">
                <div class="content">
                    <h2>注册</h2>
                    <form id="form-signup" method="post" onsubmit="return false;">
                        <div class="form-element form-stack">
                            <label for="email" class="form-label">邮箱号</label>
                            <input id="email" type="email" name="email">
                        </div>
                        <div class="form-element form-stack">
                            <label for="username-signup" class="form-label">用户名</label>
                            <input id="username-signup" type="text" name="username-signup">
                        </div>
                        <div class="form-element form-stack">
                            <label for="password-signup" class="form-label">密码</label>
                            <input id="password-signup" type="password" name="password-signup">
                        </div>
                        <div class="form-element form-checkbox">
                            <input id="confirm-terms" type="checkbox" name="confirm" value="yes" class="checkbox">
                            <label for="confirm-terms">我同意 <a href="security.html">《用户隐私协议》</a></label>
                        </div>
                        <div class="form-element form-submit">
                            <button id="signUp" class="signup" type="button" name="signup" onclick="beforeregister()">注册</button>
                            <button id="goLeft" class="signup off">登录</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="right">
                <div class="content">
                    <h2>登录</h2>
                    <form id="form-login" method="post" onsubmit="return false;">
                        <div class="form-element form-stack">
                            <label for="username-login" class="form-label">用户名</label>
                            <input id="username-login" type="text" name="username-login">
                        </div>
                        <div class="form-element form-stack">
                            <label for="password-login" class="form-label">密码</label>
                            <input id="password-login" type="password" name="password-login">
                        </div>
                        <div class="form-element form-submit">
                            <button id="logIn" class="login" type="button" name="login" onclick="logining()">登录</button>
                            <button id="goRight" class="login off" name="signup">注册</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div id="messageBox" class="message-box">
        <div id="messageContent" class="message-content"></div>
      </div>
      
</body>
<script type="text/javascript" src="../js/config.js"></script>
<script type="text/javascript" src="../js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="../js/search.js"></script>
<script type="text/javascript">
    function beforeregister(){
        document.getElementById("signUp").addEventListener("click", function() {
    var confirmTerms = document.getElementById("confirm-terms");

    if (confirmTerms.checked) {
      // 用户勾选了同意用户隐私协议，可以发送注册请求
      register();
    } else {
      // 用户未勾选同意用户隐私协议，显示错误信息
      showMessage("error", "请同意用户隐私协议后再进行注册！");
    }
  });
    }
    function register() {
        var username = document.getElementById('username-signup').value;
        var password = document.getElementById('password-signup').value;
        var email = document.getElementById('email').value;
        console.log('用户名: ' + username);
        console.log('密码: ' + password);
        console.log('邮箱: ' + email);
        $.ajax({
            url: BASE_URL + '/api/register/',
            type: 'POST',
            dataType: 'json',
            data: {
                'username': username,
                'password': password,
                'email': email,
                'like':'000000000000'
            },
            success: function (data) {
                console.log(data);
            },
            error: function (jqXHR, textStatus, errorThrown) {
                console.log(textStatus, errorThrown);
            }
        });
    }
    
    function logining() {
        var username = document.getElementById('username-login').value;
        var password = document.getElementById('password-login').value;

        console.log('用户名: ' + username);
        console.log('密码: ' + password);
        $.ajax({
            url: BASE_URL + '/api/login/',
            type: 'POST',
            dataType: 'json',
            data: {
                'username': username,
                'password': password
            },
            success: function (data) {
                console.log(data);
                if (data.status === 'success') {
                    // 登录成功，显示成功消息
                    showMessage('success', data.message);
                    isUserLoggedIn = true;
                    location.href = '../space.html';
                } else {
                    // 登录失败，显示错误消息
                    showMessage('error', data.message);
                }
            },
            error: function (jqXHR, textStatus, errorThrown) {
                console.log(textStatus, errorThrown);
                showMessage('error', '请求发生错误，请重试！');
            }
        });
    }

    function showMessage(status, message) {
    var messageBox = document.getElementById('messageBox');
    var messageContent = document.getElementById('messageContent');
    messageContent.textContent = message;

    // 移除之前的样式类，添加新的样式类
    messageBox.classList.remove('success', 'error');
    messageBox.classList.add(status);

    messageBox.style.display = 'block';
    setTimeout(function() {
      messageBox.style.opacity = '0'; // 添加淡出效果
      setTimeout(function() {
        messageBox.style.display = 'none';
        messageBox.style.opacity = '1'; // 恢复不透明度
      }, 50); // 300毫秒后隐藏弹框，可根据需要调整
    }, 500); // 3秒后隐藏弹框，你可以根据需要调整显示时间
  }
</script>
<script type="text/javascript">
    /* ====================== *
 *  Toggle Between        *
 *  Sign Up / Login       *
 * ====================== */
    $(document).ready(function () {
        $('#goRight').on('click', function () {
            $('#slideBox').animate({
                'marginLeft': '0'
            });
            $('.topLayer').animate({
                'marginLeft': '100%'
            });
        });
        $('#goLeft').on('click', function () {
            if (window.innerWidth > 769) {
                $('#slideBox').animate({
                    'marginLeft': '50%'
                });
            }
            else {
                $('#slideBox').animate({
                    'marginLeft': '20%'
                });
            }
            $('.topLayer').animate({
                'marginLeft': '0'
            });
        });
    });

    /* ====================== *
     *  Initiate Canvas       *
     * ====================== */
    paper.install(window);
    paper.setup(document.getElementById("canvas"));

    // Paper JS Variables
    var canvasWidth,
        canvasHeight,
        canvasMiddleX,
        canvasMiddleY;

    var shapeGroup = new Group();

    var positionArray = [];

    function getCanvasBounds() {
        // Get current canvas size
        canvasWidth = view.size.width;
        canvasHeight = view.size.height;
        canvasMiddleX = canvasWidth / 2;
        canvasMiddleY = canvasHeight / 2;
        // Set path position
        var position1 = {
            x: (canvasMiddleX / 2) + 100,
            y: 100,
        };

        var position2 = {
            x: 200,
            y: canvasMiddleY,
        };

        var position3 = {
            x: (canvasMiddleX - 50) + (canvasMiddleX / 2),
            y: 150,
        };

        var position4 = {
            x: 0,
            y: canvasMiddleY + 100,
        };

        var position5 = {
            x: canvasWidth - 130,
            y: canvasHeight - 75,
        };

        var position6 = {
            x: canvasMiddleX + 80,
            y: canvasHeight - 50,
        };

        var position7 = {
            x: canvasWidth + 60,
            y: canvasMiddleY - 50,
        };

        var position8 = {
            x: canvasMiddleX + 100,
            y: canvasMiddleY + 100,
        };

        positionArray = [position3, position2, position5, position4, position1, position6, position7, position8];
    };


    /* ====================== *
     * Create Shapes          *
     * ====================== */
    function initializeShapes() {
        // Get Canvas Bounds
        getCanvasBounds();

        var shapePathData = [
            'M231,352l445-156L600,0L452,54L331,3L0,48L231,352',
            'M0,0l64,219L29,343l535,30L478,37l-133,4L0,0z',
            'M0,65l16,138l96,107l270-2L470,0L337,4L0,65z',
            'M333,0L0,94l64,219L29,437l570-151l-196-42L333,0',
            'M331.9,3.6l-331,45l231,304l445-156l-76-196l-148,54L331.9,3.6z',
            'M389,352l92-113l195-43l0,0l0,0L445,48l-80,1L122.7,0L0,275.2L162,297L389,352',
            'M 50 100 L 300 150 L 550 50 L 750 300 L 500 250 L 300 450 L 50 100',
            'M 700 350 L 500 350 L 700 500 L 400 400 L 200 450 L 250 350 L 100 300 L 150 50 L 350 100 L 250 150 L 450 150 L 400 50 L 550 150 L 350 250 L 650 150 L 650 50 L 700 150 L 600 250 L 750 250 L 650 300 L 700 350 '
        ];

        for (var i = 0; i <= shapePathData.length; i++) {
            // Create shape
            var headerShape = new Path({
                strokeColor: 'rgba(255, 255, 255, 0.5)',
                strokeWidth: 2,
                parent: shapeGroup,
            });
            // Set path data
            headerShape.pathData = shapePathData[i];
            headerShape.scale(2);
            // Set path position
            headerShape.position = positionArray[i];
        }
    };

    initializeShapes();

    /* ====================== *
     * Animation              *
     * ====================== */
    view.onFrame = function paperOnFrame(event) {
        if (event.count % 4 === 0) {
            // Slows down frame rate
            for (var i = 0; i < shapeGroup.children.length; i++) {
                if (i % 2 === 0) {
                    shapeGroup.children[i].rotate(-0.1);
                } else {
                    shapeGroup.children[i].rotate(0.1);
                }
            }
        }
    };

    view.onResize = function paperOnResize() {
        getCanvasBounds();

        for (var i = 0; i < shapeGroup.children.length; i++) {
            shapeGroup.children[i].position = positionArray[i];
        }

        if (canvasWidth < 700) {
            shapeGroup.children[3].opacity = 0;
            shapeGroup.children[2].opacity = 0;
            shapeGroup.children[5].opacity = 0;
        } else {
            shapeGroup.children[3].opacity = 1;
            shapeGroup.children[2].opacity = 1;
            shapeGroup.children[5].opacity = 1;
        }
    };
</script>

</html>
