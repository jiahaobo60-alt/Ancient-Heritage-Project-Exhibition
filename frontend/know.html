<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>民族之窗 — 飞檐翚影</title>
    <link rel="stylesheet" href="css/architecture_common.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== 设计系统变量 ===== */
        :root {
            --primary:       #444C5E;
            --primary-light: #5A6478;
            --primary-dark:  #2A3246;
            --secondary:     #A29192;
            --accent:        #8A9BC5;
            --bg:            #F0F2F5;
            --bg-card:       #FFFFFF;
            --bg-muted:      #E8EBF0;
            --text-main:     #2A3246;
            --text-sub:      #4A5568;
            --text-muted:    #9E9E9E;
            --border:        rgba(68,76,94,0.14);
            --shadow-sm:     0 2px 8px rgba(42,50,70,0.08);
            --shadow-md:     0 6px 20px rgba(42,50,70,0.12);
            --shadow-lg:     0 16px 48px rgba(42,50,70,0.18);
            --radius-sm:     6px;
            --radius-md:     12px;
            --transition:    0.32s cubic-bezier(0.4,0,0.2,1);
            /* 分类色 */
            --roof-color:    #A93226;
            --structure-color: #1E8449;
            --function-color: #8A9BC5;
            --component-color: #444C5E;
            --region-color:  #2471A3;
            --building-color: #884EA0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            font-family: 'Noto Serif SC', 'SimSun', serif;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== 导航栏 ===== */
        .nav-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 64px;
            background: #444C5E;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0 48px;
            z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 16px rgba(0,0,0,0.22);
        }
        .nav-logo {
            color: #F7F3ED; font-size: 1.4em; font-weight: bold;
            text-decoration: none; display: flex; align-items: center;
            gap: 10px; letter-spacing: 0.08em;
        }
        .nav-logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #F7F3ED;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-link {
            color: rgba(245,245,220,0.85); text-decoration: none;
            padding: 8px 14px; border-radius: var(--radius-sm);
            transition: all var(--transition);
            font-size: 0.95em; letter-spacing: 0.03em;
        }
        .nav-link:hover, .nav-link.active {
            background: #A29192; 
            color: #F7F3ED;
        }
        .nav-user { display: flex; align-items: center; gap: 12px; }
        .nav-user a {
            color: rgba(245,245,220,0.85); text-decoration: none;
            font-size: 0.9em; transition: color var(--transition);
        }
        .nav-user a:hover { color: #F7F3ED; }

        /* ===== 页面头部 ===== */
        .page-header {
            padding-top: 96px; padding-bottom: 28px;
            text-align: center;
            background: linear-gradient(180deg, rgba(68,76,94,0.08) 0%, transparent 100%);
            position: relative;
        }
        .page-header::after {
            content: '';
            position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--secondary), transparent);
        }
        .page-header h1 {
            font-size: 2.2rem; color: var(--text-main);
            letter-spacing: 0.12em; margin-bottom: 10px;
        }
        .page-header h1 span {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p {
            color: var(--text-sub); font-size: 0.95em;
            letter-spacing: 0.05em;
        }

        /* ===== 主布局 ===== */
        .main-layout {
            display: flex;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 24px 40px;
            gap: 20px;
            min-height: calc(100vh - 200px);
        }

        /* ===== 左侧搜索面板 ===== */
        .left-panel {
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 16px;
        }

        .panel-title {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.06em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-title::before {
            content: '';
            width: 3px; height: 14px;
            background: var(--accent);
            border-radius: 2px;
        }



         /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(139,69,19,0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139,69,19,0.3);
        }
        
        /* 搜索框 */
        .search-box {
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'Noto Serif SC', serif;
            font-size: 13px;
            color: var(--text-main);
            background: var(--bg);
            outline: none;
            transition: all var(--transition);
        }
        .search-box input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(212,165,116,0.15);
            background: #fff;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box .search-icon {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px;
        }

        /* 分类筛选 - 按建筑结构 */
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 13px;
            color: var(--text-sub);
            user-select: none;
        }
        .filter-item:hover { background: rgba(139,69,19,0.06); }
        .filter-item.active { background: rgba(139,69,19,0.1); color: var(--primary); font-weight: 600; }
        .filter-dot {
            width: 12px; height: 12px; border-radius: 3px;
            flex-shrink: 0;
        }
        .filter-count {
            margin-left: auto;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-muted);
            padding: 1px 6px;
            border-radius: 10px;
        }

        /* 图例 */
        .legend-group { display: flex; flex-direction: column; gap: 8px; }
        .legend-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-sub);
        }
        .legend-shape {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .legend-circle {
            border-radius: 50%;
        }
        .legend-diamond {
            width: 12px; height: 12px;
            transform: rotate(45deg);
            border-radius: 2px;
        }
        .legend-rect {
            border-radius: 3px;
        }

        /* ===== 中央图谱区域 ===== */
        .graph-area {
            flex: 1;
            min-width: 0;
            position: relative;
        }
        .graph-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            position: relative;
            height: calc(100vh - 220px);
            min-height: 560px;
        }
        #graph-svg {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FEFCFA 0%, #F7F3ED 50%, #F5F5DC 100%);
        }

        /* 图谱内工具条 */
        .graph-toolbar {
            position: absolute; top: 12px; right: 12px;
            display: flex; gap: 6px; z-index: 10;
        }
        .toolbar-btn {
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-sub);
            font-size: 16px;
            transition: all var(--transition);
        }
        .toolbar-btn:hover {
            background: #fff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* 统计条 */
        .graph-stats {
            position: absolute; bottom: 12px; left: 12px;
            display: flex; gap: 16px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            z-index: 10;
            font-size: 12px; color: var(--text-muted);
        }
        .stat-item span { color: var(--primary); font-weight: 600; }

        /* SVG 节点样式 */
        .link-line {
            stroke: rgba(139,69,19,0.18);
            stroke-width: 1.2;
            transition: stroke 0.2s, stroke-width 0.2s, opacity 0.2s;
        }
        .link-line.highlighted {
            stroke: rgba(196,30,58,0.45);
            stroke-width: 2.2;
        }
        .link-line.dimmed {
            opacity: 0.06;
        }
        .node-circle {
            stroke: rgba(255,255,255,0.7);
            stroke-width: 2;
            cursor: pointer;
            transition: opacity 0.2s, r 0.2s;
        }
        .node-circle:hover {
            stroke-width: 3;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
        }
        .node-circle.dimmed { opacity: 0.12; }
        .node-circle.selected {
            stroke: var(--accent);
            stroke-width: 3;
            filter: drop-shadow(0 0 8px rgba(196,30,58,0.3));
        }
        .node-diamond {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .node-diamond:hover {
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
        }
        .node-diamond.dimmed { opacity: 0.12; }
        .node-diamond.selected {
            stroke: var(--accent);
            stroke-width: 2.5;
        }
        .node-label {
            font-family: 'Noto Serif SC', serif;
            fill: var(--text-main);
            font-size: 11px;
            pointer-events: none;
            text-anchor: middle;
            transition: opacity 0.2s;
        }
        .node-label.dimmed { opacity: 0.12; }
        .node-label.highlighted {
            font-weight: 600;
            font-size: 12px;
        }

        /* ===== 右侧信息面板 ===== */
        .right-panel {
            width: 280px;
            flex-shrink: 0;
        }

        .info-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .info-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .info-type-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .info-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.04em;
        }

        .info-body {
            padding: 16px;
        }
        .info-row {
            display: flex;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.7;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label {
            color: var(--text-muted);
            width: 64px;
            flex-shrink: 0;
            font-size: 12px;
        }
        .info-value {
            color: var(--text-sub);
            flex: 1;
        }

        .info-placeholder {
            padding: 40px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.8;
        }
        .info-placeholder-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* 关联节点列表 */
        .related-section {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }
        .related-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        .related-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .related-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--bg-muted);
            color: var(--text-sub);
            cursor: pointer;
            transition: all var(--transition);
        }
        .related-tag:hover {
            background: rgba(139,69,19,0.12);
            color: var(--primary);
        }

        /* ===== 底部 ===== */
        footer {
            background: var(--primary-dark);
            color: rgba(245,245,220,0.6);
            text-align: center;
            padding: 20px 24px;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .left-panel { width: 200px; }
            .right-panel { width: 240px; }
        }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .left-panel, .right-panel { width: 100%; }
            .left-panel { flex-direction: row; flex-wrap: wrap; }
            .left-panel .panel-card { flex: 1; min-width: 200px; }
            .graph-wrapper { height: 500px; }
            .nav-bar { padding: 0 16px; }
            .nav-links { display: none; }
        }
        @media (max-width: 600px) {
            .page-header h1 { font-size: 1.5rem; }
            .graph-wrapper { height: 400px; }
        }

        /* ===== 入场动画 ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .page-header   { animation: fadeInUp 0.6s ease-out; }
        .left-panel     { animation: fadeInUp 0.6s ease-out 0.1s both; }
        .graph-area     { animation: fadeInUp 0.6s ease-out 0.2s both; }
        .right-panel    { animation: fadeInUp 0.6s ease-out 0.3s both; }
    </style>
</head>

</nav>

<!-- 页面头部 -->
<div class="page-header">
    <h1><span>民族之窗</span> · 建筑结构图谱</h1>
    <p>知识图谱揭示中国古建筑的结构体系与构造特征</p>
</div>

<!-- 主布局 -->
<div class="main-layout">

    <!-- 左侧搜索面板 -->
    <div class="left-panel">
        <!-- 搜索 -->
        <div class="panel-card">
            <div class="panel-title">搜索节点</div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="输入名称搜索...">
            </div>
        </div>

        <!-- 分类筛选 - 按建筑结构特征 -->
        <div class="panel-card">
            <div class="panel-title">结构分类</div>
            <div class="filter-group" id="filterGroup">
                <div class="filter-item active" data-type="all">
                    <span class="filter-dot" style="background:var(--primary);"></span>
                    全部
                    <span class="filter-count" id="countAll">0</span>
                </div>
                <div class="filter-item" data-type="roof">
                    <span class="filter-dot" style="background:var(--roof-color);"></span>
                    屋顶形式
                    <span class="filter-count" id="countRoof">0</span>
                </div>
                <div class="filter-item" data-type="structure">
                    <span class="filter-dot" style="background:var(--structure-color);"></span>
                    结构体系
                    <span class="filter-count" id="countStructure">0</span>
                </div>
                <div class="filter-item" data-type="function">
                    <span class="filter-dot" style="background:var(--function-color);"></span>
                    功能类型
                    <span class="filter-count" id="countFunction">0</span>
                </div>
                <div class="filter-item" data-type="component">
                    <span class="filter-dot" style="background:var(--component-color);"></span>
                    建筑构件
                    <span class="filter-count" id="countComponent">0</span>
                </div>
                <div class="filter-item" data-type="region">
                    <span class="filter-dot" style="background:var(--region-color);"></span>
                    地域风格
                    <span class="filter-count" id="countRegion">0</span>
                </div>
                <div class="filter-item" data-type="building">
                    <span class="filter-dot" style="background:var(--building-color);"></span>
                    代表建筑
                    <span class="filter-count" id="countBuilding">0</span>
                </div>
            </div>
        </div>

        <!-- 图例 -->
        <div class="panel-card">
            <div class="panel-title">图例说明</div>
            <div class="legend-group">
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-circle" style="width:16px;height:16px;background:var(--roof-color);"></span></span>
                    屋顶形式（大圆）
                </div>
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-circle" style="width:14px;height:14px;background:var(--structure-color);"></span></span>
                    结构体系（中圆）
                </div>
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-circle" style="width:12px;height:12px;background:var(--function-color);"></span></span>
                    功能类型（中圆）
                </div>
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-circle" style="width:10px;height:10px;background:var(--component-color);"></span></span>
                    建筑构件（小圆）
                </div>
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-diamond" style="background:var(--region-color);"></span></span>
                    地域风格（菱形）
                </div>
                <div class="legend-item">
                    <span class="legend-shape"><span class="legend-rect" style="width:14px;height:14px;background:var(--building-color);"></span></span>
                    代表建筑（方块）
                </div>
                <div class="legend-item" style="margin-top:4px; padding-top:6px; border-top:1px solid var(--border);">
                    <span class="legend-shape" style="width:24px; height:1px; background:rgba(139,69,19,0.3);"></span>
                    包含/使用关系
                </div>
                <div class="legend-item">
                    <span class="legend-shape" style="width:24px; height:2px; background:rgba(196,30,58,0.5);"></span>
                    选中高亮
                </div>
            </div>
        </div>
    </div>

    <!-- 中央图谱 -->
    <div class="graph-area">
        <div class="graph-wrapper" id="graphWrapper">
            <svg id="graph-svg"></svg>
            <!-- 工具条 -->
            <div class="graph-toolbar">
                <div class="toolbar-btn" id="btnZoomIn" title="放大">＋</div>
                <div class="toolbar-btn" id="btnZoomOut" title="缩小">－</div>
                <div class="toolbar-btn" id="btnReset" title="重置视图">⟳</div>
            </div>
            <!-- 统计 -->
            <div class="graph-stats" id="graphStats">
                <span class="stat-item">节点 <span id="statNodes">0</span></span>
                <span class="stat-item">关系 <span id="statLinks">0</span></span>
            </div>
        </div>
    </div>

    <!-- 右侧信息面板 -->
    <div class="right-panel">
        <div class="info-card" id="infoCard">
            <div class="info-placeholder" id="infoPlaceholder">
                <div class="info-placeholder-icon">🏛</div>
                <div>点击图谱中的节点<br>查看详细信息</div>
            </div>
            <div id="infoContent" style="display:none;">
                <div class="info-header" id="infoHeader">
                    <span class="info-type-badge" id="infoBadge">分类</span>
                    <span class="info-name" id="infoName">—</span>
                </div>
                <div class="info-body" id="infoBody"></div>
                <div class="related-section" id="relatedSection" style="display:none;">
                    <div class="related-title">关联节点</div>
                    <div class="related-list" id="relatedList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 底部 -->
<footer>
    <p>飞檐翚影 · 中国古建筑文化展示平台 | 传承千年营造智慧，守护中华建筑文明</p>
</footer>

(function() {

       ===================================================== */

    var svg = d3.select('#graph-svg');
    var wrapper = document.getElementById('graphWrapper');
    var width = wrapper.clientWidth;
    var height = wrapper.clientHeight;

    svg.attr('width', width).attr('height', height);

    // 缩放
    var g = svg.append('g');
    var zoom = d3.zoom()
        .scaleExtent([0.2, 4])
        .on('zoom', function() {
            g.attr('transform', d3.event.transform);
        });
    svg.call(zoom);

    // 创建容器
    var linkGroup = g.append('g').attr('class', 'links');
    var nodeGroup = g.append('g').attr('class', 'nodes');
    var labelGroup = g.append('g').attr('class', 'labels');

    // 力模拟
    var simulation = d3.forceSimulation()
        .force('link', d3.forceLink().id(function(d) { return d.id; }).distance(function(d) {
            var sType = (typeof d.source === 'object') ? d.source.type : findNode(d.source).type;
            var tType = (typeof d.target === 'object') ? d.target.type : findNode(d.target).type;
            if (sType === tType) return 100;
            if (sType === 'building' || tType === 'building') return 80;
            if (sType === 'component' || tType === 'component') return 90;
            return 110;
        }))
        .force('charge', d3.forceManyBody().strength(function(d) {
            if (d.type === 'roof') return -400;
            if (d.type === 'structure') return -300;
            if (d.type === 'function') return -280;
            if (d.type === 'building') return -180;
            return -150;
        }))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(function(d) {
            return getRadius(d) + 10;
        }))
        .force('x', d3.forceX(width / 2).strength(0.04))
        .force('y', d3.forceY(height / 2).strength(0.04));

    function findNode(id) {
        for (var i = 0; i < graphNodes.length; i++) {
            if (graphNodes[i].id === id) return graphNodes[i];
        }
        return { type: 'unknown' };
    }

    function getRadius(d) {
        switch(d.type) {
            case 'roof':      return 26;
            case 'structure': return 20;
            case 'function':  return 18;
            case 'component': return 12;
            case 'region':    return 14;
            case 'building':  return 15;
            default:          return 10;
        }
    }

    function getColor(d) {
        return typeColors[d.type] || '#8A9BC5';
    }

    // 绘制连线
    var linkSel = linkGroup.selectAll('line')
        .data(graphLinks)
        .enter().append('line')
        .attr('class', 'link-line');

    // 绘制节点
    var nodeSel = nodeGroup.selectAll('g')
        .data(graphNodes)
        .enter().append('g')
        .attr('class', function(d) { return 'node-g node-' + d.type; })
        .call(d3.drag()
            .on('start', dragStart)
            .on('drag', dragging)
            .on('end', dragEnd)
        );

    // 圆形节点：roof, structure, function, component, building
    var circleNodes = nodeSel.filter(function(d) { return d.type !== 'region'; });
    circleNodes.append('circle')
        .attr('class', 'node-circle')
        .attr('r', function(d) { return getRadius(d); })
        .attr('fill', function(d) { return getColor(d); });

    // 菱形节点：region
    var diamondNodes = nodeSel.filter(function(d) { return d.type === 'region'; });
    diamondNodes.append('rect')
        .attr('class', 'node-diamond')
        .attr('width', 18).attr('height', 18)
        .attr('x', -9).attr('y', -9)
        .attr('rx', 2).attr('ry', 2)
        .attr('fill', function(d) { return getColor(d); })
        .attr('stroke', 'rgba(255,255,255,0.7)')
        .attr('stroke-width', 1.5)
        .attr('transform', 'rotate(45)');

    // 标签
    var labelSel = labelGroup.selectAll('text')
        .data(graphNodes)
        .enter().append('text')
        .attr('class', 'node-label')
        .attr('dy', function(d) { return getRadius(d) + 14; })
        .text(function(d) { return d.name; });

    // 点击节点
    nodeSel.on('click', function(d) {
        selectNode(d);
    });

    // 启动模拟
    simulation.nodes(graphNodes).on('tick', ticked);
    simulation.force('link').links(graphLinks);

    function ticked() {
        linkSel
            .attr('x1', function(d) { return d.source.x; })
            .attr('y1', function(d) { return d.source.y; })
            .attr('x2', function(d) { return d.target.x; })
            .attr('y2', function(d) { return d.target.y; });

        nodeSel.attr('transform', function(d) {
            return 'translate(' + d.x + ',' + d.y + ')';
        });

        labelSel
            .attr('x', function(d) { return d.x; })
            .attr('y', function(d) { return d.y; });
    }

    // 初始缩放
    var initScale = 0.6;
    svg.call(zoom.transform,
        d3.zoomIdentity.translate(
            width / 2 * (1 - initScale),
            height / 2 * (1 - initScale)
        ).scale(initScale)
    );

    // 拖拽
    function dragStart(d) {
        if (!d3.event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
    }
    function dragging(d) {
        d.fx = d3.event.x; d.fy = d3.event.y;
    }
    function dragEnd(d) {
        if (!d3.event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
    }

    /* =====================================================
       交互逻辑
       ===================================================== */

    var selectedNode = null;
    var activeFilter = 'all';

    // 选中节点 → 高亮关联
    function selectNode(d) {
        if (selectedNode && selectedNode.id === d.id) {
            clearSelection();
            return;
        }
        selectedNode = d;

        // 找出关联节点ID
        var connectedIds = new Set();
        connectedIds.add(d.id);
        graphLinks.forEach(function(l) {
            var sId = (typeof l.source === 'object') ? l.source.id : l.source;
            var tId = (typeof l.target === 'object') ? l.target.id : l.target;
            if (sId === d.id) connectedIds.add(tId);
            if (tId === d.id) connectedIds.add(sId);
        });

        // 更新连线
        linkSel.attr('class', function(l) {
            var sId = (typeof l.source === 'object') ? l.source.id : l.source;
            var tId = (typeof l.target === 'object') ? l.target.id : l.target;
            if (sId === d.id || tId === d.id) return 'link-line highlighted';
            return 'link-line dimmed';
        });

        // 更新节点
        nodeSel.each(function(n) {
            var el = d3.select(this);
            var isConnected = connectedIds.has(n.id);
            el.select('.node-circle, .node-diamond')
                .classed('dimmed', !isConnected)
                .classed('selected', n.id === d.id);
        });

        // 更新标签
        labelSel.attr('class', function(n) {
            if (n.id === d.id) return 'node-label highlighted';
            if (connectedIds.has(n.id)) return 'node-label';
            return 'node-label dimmed';
        });

        // 更新信息面板
        showInfo(d, connectedIds);
    }

    function clearSelection() {
        selectedNode = null;
        linkSel.attr('class', 'link-line');
        nodeSel.selectAll('.node-circle, .node-diamond').classed('dimmed', false).classed('selected', false);
        labelSel.attr('class', 'node-label');
        hideInfo();
    }

    // 显示信息面板
    function showInfo(d, connectedIds) {
        document.getElementById('infoPlaceholder').style.display = 'none';
        document.getElementById('infoContent').style.display = 'block';

        var badge = document.getElementById('infoBadge');
        var typeNames = {
            roof: '屋顶形式',
            structure: '结构体系',
            function: '功能类型',
            component: '建筑构件',
            region: '地域风格',
            building: '代表建筑'
        };
        badge.textContent = typeNames[d.type] || d.type;
        badge.style.background = getColor(d);

        document.getElementById('infoName').textContent = d.name;

        var body = document.getElementById('infoBody');
        body.innerHTML = '';

        if (d.desc) {
            addInfoRow(body, '简介', d.desc);
        }
        if (d.level !== undefined && d.level !== null) {
            var levelNames = ['最高（重檐）', '第一等', '第二等', '第三等', '第四等', '园林用'];
            addInfoRow(body, '等级', levelNames[d.level] || '');
        }
        if (d.category) {
            addInfoRow(body, '分类', d.category);
        }
        if (d.dynasty) {
            addInfoRow(body, '时代', d.dynasty);
        }
        if (d.region) {
            addInfoRow(body, '地域', d.region);
        }
        if (d.feature) {
            addInfoRow(body, '特征', d.feature);
        }
        if (d.evolution) {
            addInfoRow(body, '演变', d.evolution);
        }
        if (d.example) {
            addInfoRow(body, '代表', d.example);
        }

        // 关联节点
        var relatedSection = document.getElementById('relatedSection');
        var relatedList = document.getElementById('relatedList');
        relatedList.innerHTML = '';
        var related = [];
        connectedIds.forEach(function(id) {
            if (id !== d.id) {
                var nd = findNode(id);
                if (nd && nd.name) related.push(nd);
            }
        });
        if (related.length > 0) {
            relatedSection.style.display = 'block';
            related.forEach(function(nd) {
                var tag = document.createElement('span');
                tag.className = 'related-tag';
                tag.textContent = nd.name;
                tag.style.borderLeft = '3px solid ' + getColor(nd);
                tag.addEventListener('click', function() {
                    selectNode(nd);
                    // 移动图谱视图到该节点
                    if (nd.x !== undefined && nd.y !== undefined) {
                        svg.transition().duration(500).call(
                            zoom.transform,
                            d3.zoomIdentity.translate(
                                width / 2 - nd.x * initScale,
                                height / 2 - nd.y * initScale
                            ).scale(initScale)
                        );
                    }
                });
                relatedList.appendChild(tag);
            });
        } else {
            relatedSection.style.display = 'none';
        }
    }

    function addInfoRow(container, label, value) {
        if (!value) return;
        var row = document.createElement('div');
        row.className = 'info-row';
        row.innerHTML = '<span class="info-label">' + label + '</span><span class="info-value">' + value + '</span>';
        container.appendChild(row);
    }

    function hideInfo() {
        document.getElementById('infoPlaceholder').style.display = 'block';
        document.getElementById('infoContent').style.display = 'none';
    }

    /* =====================================================
       搜索功能
       ===================================================== */

    document.getElementById('searchInput').addEventListener('input', function() {
        var keyword = this.value.trim();
        if (!keyword) {
            if (!selectedNode) clearSelection();
            return;
        }

        // 搜索匹配的节点
        var matchedIds = new Set();
        graphNodes.forEach(function(n) {
            if (n.name.indexOf(keyword) >= 0 || (n.desc && n.desc.indexOf(keyword) >= 0)) {
                matchedIds.add(n.id);
            }
        });

        // 扩展到关联节点
        var expandedIds = new Set(matchedIds);
        graphLinks.forEach(function(l) {
            var sId = (typeof l.source === 'object') ? l.source.id : l.source;
            var tId = (typeof l.target === 'object') ? l.target.id : l.target;
            if (matchedIds.has(sId)) expandedIds.add(tId);
            if (matchedIds.has(tId)) expandedIds.add(sId);
        });

        // 更新视觉
        linkSel.attr('class', function(l) {
            var sId = (typeof l.source === 'object') ? l.source.id : l.source;
            var tId = (typeof l.target === 'object') ? l.target.id : l.target;
            if (matchedIds.has(sId) || matchedIds.has(tId)) return 'link-line highlighted';
            return 'link-line dimmed';
        });

        nodeSel.each(function(n) {
            var el = d3.select(this);
            el.select('.node-circle, .node-diamond')
                .classed('dimmed', !expandedIds.has(n.id))
                .classed('selected', matchedIds.has(n.id));
        });

        labelSel.attr('class', function(n) {
            if (matchedIds.has(n.id)) return 'node-label highlighted';
            if (expandedIds.has(n.id)) return 'node-label';
            return 'node-label dimmed';
        });
    });

    /* =====================================================
       分类筛选
       ===================================================== */

    document.querySelectorAll('.filter-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.filter-item').forEach(function(el) {
                el.classList.remove('active');
            });
            this.classList.add('active');

            var filterType = this.getAttribute('data-type');
            activeFilter = filterType;

            if (filterType === 'all') {
                // 显示全部
                nodeSel.each(function(n) {
                    d3.select(this).select('.node-circle, .node-diamond').classed('dimmed', false);
                });
                labelSel.attr('class', 'node-label');
                linkSel.attr('class', 'link-line');
            } else {
                // 筛选类型
                var visibleIds = new Set();
                graphNodes.forEach(function(n) {
                    if (n.type === filterType) visibleIds.add(n.id);
                });
                // 扩展关联
                var expandedIds = new Set(visibleIds);
                graphLinks.forEach(function(l) {
                    var sId = (typeof l.source === 'object') ? l.source.id : l.source;
                    var tId = (typeof l.target === 'object') ? l.target.id : l.target;
                    if (visibleIds.has(sId)) expandedIds.add(tId);
                    if (visibleIds.has(tId)) expandedIds.add(sId);
                });

                nodeSel.each(function(n) {
                    d3.select(this).select('.node-circle, .node-diamond')
                        .classed('dimmed', !expandedIds.has(n.id))
                        .classed('selected', visibleIds.has(n.id));
                });
                labelSel.attr('class', function(n) {
                    if (visibleIds.has(n.id)) return 'node-label highlighted';
                    if (expandedIds.has(n.id)) return 'node-label';
                    return 'node-label dimmed';
                });
                linkSel.attr('class', function(l) {
                    var sId = (typeof l.source === 'object') ? l.source.id : l.source;
                    var tId = (typeof l.target === 'object') ? l.target.id : l.target;
                    if (visibleIds.has(sId) || visibleIds.has(tId)) return 'link-line highlighted';
                    return 'link-line dimmed';
                });
            }
        });
    });

    /* =====================================================
       工具栏按钮
       ===================================================== */

    document.getElementById('btnZoomIn').addEventListener('click', function() {
        svg.transition().duration(300).call(zoom.scaleBy, 1.4);
    });
    document.getElementById('btnZoomOut').addEventListener('click', function() {
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
    });
    document.getElementById('btnReset').addEventListener('click', function() {
        clearSelection();
        document.getElementById('searchInput').value = '';
        activeFilter = 'all';
        document.querySelectorAll('.filter-item').forEach(function(el) { el.classList.remove('active'); });
        document.querySelector('.filter-item[data-type="all"]').classList.add('active');
        svg.transition().duration(500).call(
            zoom.transform,
            d3.zoomIdentity.translate(
                width / 2 * (1 - initScale),
                height / 2 * (1 - initScale)
            ).scale(initScale)
        );
    });

    /* =====================================================
       统计更新
       ===================================================== */

    function updateCounts() {
        var counts = {
            all: graphNodes.length,
            roof: 0,
            structure: 0,
            function: 0,
            component: 0,
            region: 0,
            building: 0
        };
        graphNodes.forEach(function(n) {
            if (counts[n.type] !== undefined) counts[n.type]++;
        });
        document.getElementById('countAll').textContent = counts.all;
        document.getElementById('countRoof').textContent = counts.roof;
        document.getElementById('countStructure').textContent = counts.structure;
        document.getElementById('countFunction').textContent = counts.function;
        document.getElementById('countComponent').textContent = counts.component;
        document.getElementById('countRegion').textContent = counts.region;
        document.getElementById('countBuilding').textContent = counts.building;

        document.getElementById('statNodes').textContent = graphNodes.length;
        document.getElementById('statLinks').textContent = graphLinks.length;
    }
    updateCounts();

    /* =====================================================
       点击空白处取消选中
       ===================================================== */

    svg.on('click', function() {
        if (d3.event.target.tagName === 'svg' || d3.event.target.tagName === 'rect') {
            clearSelection();
        }
    });

    /* =====================================================
       窗口大小变化
       ===================================================== */

    window.addEventListener('resize', function() {
        width = wrapper.clientWidth;
        height = wrapper.clientHeight;
        svg.attr('width', width).attr('height', height);
        simulation.force('center', d3.forceCenter(width / 2, height / 2));
        simulation.force('x', d3.forceX(width / 2).strength(0.04));
        simulation.force('y', d3.forceY(height / 2).strength(0.04));
        simulation.alpha(0.3).restart();
    });

})();
</script>
</body>
</html>
