    <script type="text/javascript">
        var kw = decodeURIComponent(getUrlParams("kw"));
        var datalist = [];


        window.onload = function () {
            var mask = document.createElement('div');
            mask.style.width = window.innerWidth + 'px';
            mask.style.height = window.innerHeight + 'px';
            mask.style.background = '#000000';
            mask.style.opacity = '.85';
            mask.style.position = 'fixed';
            mask.style.top = '0';
            mask.style.left = '0';
            mask.style.zIndex = "8888";
            document.body.appendChild(mask);
            startLoading();
            $.ajax({
                // url: "http://localhost:8000/api/details?kw=" + kw,
                url: BASE_URL + '/api/details?kw=' + kw,
                type: "get",
                dataType: "json",
                success: function (data) {
                    /*这个方法里是ajax发送请求成功之后执行的代码*/
                    datalist = data.results;
                    showData(data.results, 0);//仅做数据展示
                    showRelevant(data.results);
                    document.body.removeChild(mask);
                    stopLoading();
                },
                error: function (msg) {
                    alert("ajax连接异常：" + msg);
                }

            });

        };

        //展示数据
        function getUrlParams(key) {
            var url = window.location.search.substr(1);
            if (url == '') {
                return false;
            }
            var paramsArr = url.split('&');
            for (var i = 0; i < paramsArr.length; i++) {
                var combina = paramsArr[i].split("=");
                if (combina[0] == key) {
                    return combina[1];
                }
            }
            return false;
        };

        function showData(data, i) {
            document.getElementById("project_id").innerHTML = data[i].project_id;
            document.getElementById("number").innerHTML = data[i].number;
            document.getElementById("public_time").innerHTML = data[i].public_time;
            document.getElementById("category").innerHTML = data[i].category;
            document.getElementById("type").innerHTML = data[i].type;
            document.getElementById("district").innerHTML = data[i].district;
            document.getElementById("protection_department").innerHTML = data[i].protection_department;
            document.getElementById("introduction").innerHTML = data[i].introduction;
            document.getElementById("name").innerHTML = data[i].name;
        }

        function showRelevantIntroduction(data) {
            document.body.scrollTop = document.documentElement.scrollTop = 0;
            showData(datalist, data.value);
        }

        function showRelevant(data) {
            var relevant_project = document.getElementById("relevant_project")
            var a = "<table><tbody>"  //变量a储存<ul>开始标签
            a += "<tr>\n" +
                "                        <th width=\"150\">编号</th>\n" +
                "                        <th width=\"215\">项目名称</th>\n" +
                "                        <th width=\"180\">类型</th>\n" +
                "                        <th>申报地区或单位</th>\n" +
                "                    </tr>"
            a += "<tr>"
            for (var i = 0; i < data.length; i++) {  //遍历list数组
                a += "<tr>"
                a += "<td>" + "<div class=\"name\">编号</div>" + data[i].project_id + "</td>"
                a += "<td>" + "<div class=\"name\">项目名称</div>" + "<button href=\"#\" title=\"点击查看详细介绍\" onclick='showRelevantIntroduction(this)'" + " value=" + i + ">" + data[i].name + "</button></td>"
                a += "<td>" + "<div class=\"name\">类别</div>" + data[i].category + "</td>"
                a += "<td>" + "<div class=\"name\">申报地区或单位</div>" + data[i].district + "</td>"
                a += "</tr>"
            }
            a += "</tr>"
            a += "</tbody></table>"
            relevant_project.innerHTML = a  //向relevant_project中写入内容

        }


    </script>

    <script>

        function gettypeslike() {
            var nonZerotypes = [];
            for (var t in types) {
                if (types[t] !== 0) {
                    nonZerotypes.push({ t: t, value: types[t] });
                }
            }

            // 按值的大小从大到小排序
            nonZerotypes.sort((a, b) => b.value - a.value);

            // 获取省份列表
            var sortedtypes = nonZerotypes.map(item => item.province);

            // 打印排序后的省份列表
            console.log(sortedtypes);
            localStorage.setItem('typeslike', JSON.stringify(sortedtypes));
        }
    </script>
