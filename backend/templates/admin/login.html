<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营造中华 - 管理后台登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "SimSun", serif;
            background: linear-gradient(135deg, #8B0000 0%, #D4A017 50%, #8B4513 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 60px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 420px;
            border: 3px solid #8B0000;
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            color: #8B0000;
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 8px;
        }
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #8B0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8B0000, #A52A2A);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 5px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #A52A2A, #8B0000);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.3);
        }
        .error-message {
            color: #D4A017;
            background: #FFF3CD;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #D4A017;
        }
        .decorative {
            text-align: center;
            margin-top: 30px;
            color: #8B0000;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>营造中华</h1>
            <p>中国古建筑史数字化平台 · 管理后台</p>
        </div>
        
        {% if form.errors %}
        <div class="error-message">
            用户名或密码错误，请重新输入
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'custom_admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">用户名</label>
                <input type="text" name="username" id="id_username" required autofocus placeholder="请输入管理员账号">
            </div>
            <div class="form-group">
                <label for="id_password">密码</label>
                <input type="password" name="password" id="id_password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="submit-btn">登 录</button>
            <input type="hidden" name="next" value="{% if next %}{{ next }}{% else %}http://localhost:9527/{% endif %}">
        </form>
        
        <div class="decorative">☸</div>
    </div>
</body>
</html>
